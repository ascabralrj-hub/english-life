<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="application-name" content="English Life 1.6"><meta name="english-life-version" content="1.6.0">
<meta name="theme-color" content="#155eef">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<title>English Life 1.6</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--primary:#155eef;--primary2:#0b4acb;--ok:#12b76a;--bad:#d92d20;--line:#e4e7ec;--soft:#eef4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}button,input{font:inherit}button{border:0;cursor:pointer}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:84px}.top,.lesson-head{color:#fff;padding:20px;border-radius:0 0 28px 28px;background:linear-gradient(135deg,#155eef,#0b4acb)}.brand{display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;font-size:21px}.top-actions{display:flex;gap:7px}.iconbtn{background:rgba(255,255,255,.16);color:#fff;padding:9px 11px;border-radius:11px}.streak{background:rgba(255,255,255,.16);padding:8px 11px;border-radius:99px;font-size:12px}.hello{font-size:28px;font-weight:850;margin-top:25px}.sub{opacity:.9;margin-top:5px}.progress{margin-top:18px;background:rgba(255,255,255,.18);height:8px;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#fff}.section{padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(16,24,40,.04)}.hero{background:linear-gradient(135deg,#eef4ff,#fff);border-color:#cddcff}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:850;color:var(--primary)}h2,h3,p{margin:0}.daily{font-size:22px;font-weight:850;margin:7px 0}.pt{color:var(--muted);margin-top:6px}.actions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}.btn{padding:12px 16px;border-radius:12px;font-weight:800}.primary{background:var(--primary);color:#fff}.secondary{background:var(--soft);color:var(--primary)}.ghost{background:#f2f4f7;color:#344054}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.module{padding:16px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:left}.module .icon{font-size:26px}.module h3{font-size:15px;margin-top:9px}.module p{font-size:12px;color:var(--muted);margin-top:4px}.bar{height:6px;background:#eaecf0;border-radius:99px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary)}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:10}.nav{background:none;color:#98a2b3;font-size:11px}.nav.active{color:var(--primary);font-weight:850}.nav span{display:block;font-size:20px;margin-bottom:3px}.back{background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:8px 11px}.lesson-title{font-size:27px;font-weight:900;margin-top:18px}.step{margin-top:6px;opacity:.88}.context{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:15px;line-height:1.5}.dialogue{display:grid;gap:9px;margin-top:12px}.bubble{padding:11px 13px;border-radius:14px;max-width:88%}.a{background:#eef4ff}.b{background:#ecfdf3;margin-left:auto}.phrase{font-size:27px;font-weight:900;line-height:1.16}.translation{font-size:16px;color:var(--muted);margin-top:8px}.listen{width:48px;height:48px;border-radius:50%;background:var(--soft);color:var(--primary);font-size:20px}.choice{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);padding:14px;border-radius:13px;margin-top:9px}.choice.correct{border-color:var(--ok);background:#ecfdf3}.choice.wrong{border-color:var(--bad);background:#fff1f0}.feedback{margin-top:12px;font-weight:800}.mic{background:#111827;color:#fff}.recording{background:#b42318!important}.pill{display:inline-block;background:#ecfdf3;color:#027a48;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:850}.small{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;text-align:center}.stat b{font-size:24px;display:block}.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;margin:10px 0 14px;font-size:15px}.setting{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.switch{width:52px;height:30px;border-radius:99px;background:#d0d5dd;padding:3px}.switch i{display:block;width:24px;height:24px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:var(--primary)}.switch.on i{transform:translateX(22px)}select{padding:9px;border:1px solid var(--line);border-radius:10px}.notice{padding:12px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:13px;margin-top:12px}.hide{display:none}
.voice-status{margin-top:12px;padding:11px 13px;border-radius:12px;background:#f8fafc;font-size:13px;line-height:1.4}.next-wrap{margin-top:14px}.text-answer{display:flex;gap:8px;margin-top:12px}.text-answer input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:12px}.success-box{border:1px solid #abefc6;background:#ecfdf3;border-radius:14px;padding:13px;margin-top:12px}.warning-box{border:1px solid #fedf89;background:#fffaeb;border-radius:14px;padding:13px;margin-top:12px}.btn:disabled{opacity:.55;cursor:not-allowed}</style></head>
<body><div id="app"></div>
<script>
const lessons=[
{id:1,mod:'Primeiros passos',icon:'🚀',title:'Apresentações e cumprimentos',desc:'Você chegou a um evento e encontrou uma pessoa nova.',context:'Imagine que você está em um evento profissional. Você encontra alguém pela primeira vez e precisa iniciar uma conversa simples.',dialogue:[['Alex','Hi! How are you?'],['You','I’m fine, thanks. And you?'],['Alex','Nice to meet you. What’s your name?'],['You','My name is Alex.']],items:[['Hi! How are you?','Oi! Como você está?'],['I’m fine, thanks. And you?','Estou bem, obrigado. E você?'],['Nice to meet you.','Prazer em conhecer você.'],['What’s your name?','Qual é o seu nome?'],['My name is Alex.','Meu nome é Alex.']]},
{id:2,mod:'Primeiros passos',icon:'🚀',title:'Falar sobre você',desc:'Você conheceu alguém e quer contar de onde é e o que faz.',context:'Você está conversando com uma pessoa estrangeira. Ela quer saber de onde você é, onde mora e o que faz.',dialogue:[['Alex','Where are you from?'],['You','I’m from Brazil.'],['Alex','Where do you live?'],['You','I live in Rio de Janeiro.']],items:[['I’m from Brazil.','Eu sou do Brasil.'],['I live in Rio de Janeiro.','Eu moro no Rio de Janeiro.'],['I work in construction.','Eu trabalho na construção civil.'],['I’m married.','Eu sou casado.'],['I have a son.','Eu tenho um filho.']]},
{id:3,mod:'Casa',icon:'🏠',title:'Em casa',desc:'Frases que você realmente usa em casa.',context:'É fim do dia. Você chegou em casa, está cansado e conversa com sua família sobre jantar e coisas da casa.',dialogue:[['You','I’m going home.'],['Family','What’s for dinner?'],['You','I’m tired.']],items:[['I’m going home.','Estou indo para casa.'],['What’s for dinner?','O que tem para o jantar?'],['I’m tired.','Estou cansado.'],['Turn on the light, please.','Acenda a luz, por favor.'],['Where are my keys?','Onde estão minhas chaves?']]},
{id:4,mod:'Casa',icon:'🏠',title:'Família e rotina',desc:'Conversas simples com a família.',context:'É manhã. Você precisa acordar, tomar café e sair para suas atividades.',dialogue:[['Family','Did you sleep well?'],['You','Yes. Let’s have breakfast.'],['Family','See you later!']],items:[['Wake up! It’s time to go.','Acorde! Está na hora de ir.'],['Did you sleep well?','Você dormiu bem?'],['Let’s have breakfast.','Vamos tomar café da manhã.'],['See you later.','Até mais tarde.'],['I’ll be back soon.','Eu volto logo.']]},
{id:5,mod:'Trabalho',icon:'💼',title:'No trabalho',desc:'Comunicação prática no ambiente profissional.',context:'Você está trabalhando em uma tarefa e precisa pedir ajuda, informar um prazo e verificar detalhes.',dialogue:[['Colleague','Are you working on it?'],['You','Yes, I’m working on it.'],['Colleague','Can you send it today?'],['You','I’ll send it today.']],items:[['I’m working on it.','Estou trabalhando nisso.'],['Can you help me?','Você pode me ajudar?'],['I’ll send it today.','Vou enviar hoje.'],['Let’s check the details.','Vamos verificar os detalhes.'],['I have a meeting at ten.','Tenho uma reunião às dez.']]},
{id:6,mod:'Trabalho',icon:'💼',title:'Reuniões e conversas',desc:'Participe de reuniões sem travar.',context:'Você está em uma reunião em inglês. Não entendeu uma parte e precisa pedir repetição sem interromper a conversa de forma brusca.',dialogue:[['Manager','Can we start?'],['You','Could you repeat that?'],['Manager','Sure.'],['You','I agree with you.']],items:[['Can we start?','Podemos começar?'],['I agree with you.','Eu concordo com você.'],['Could you repeat that?','Você poderia repetir?'],['What do you mean?','O que você quer dizer?'],['Let’s move on.','Vamos continuar.']]},
{id:7,mod:'Viagem',icon:'✈️',title:'Aeroporto',desc:'Check-in, embarque e informações.',context:'Você acabou de chegar ao aeroporto de outro país. Precisa fazer check-in e descobrir o portão de embarque.',dialogue:[['Agent','Can I see your passport?'],['You','Here is my passport.'],['Agent','Boarding is at 8.'],['You','What time is boarding?']],items:[['Where is the check-in counter?','Onde fica o balcão de check-in?'],['Here is my passport.','Aqui está meu passaporte.'],['What time is boarding?','Que horas é o embarque?'],['Is the flight on time?','O voo está no horário?'],['Where is gate 12?','Onde fica o portão 12?']]},
{id:8,mod:'Viagem',icon:'✈️',title:'Hotel',desc:'Check-in, quarto e pedidos.',context:'Você chegou ao hotel depois de uma viagem. Tem uma reserva e precisa fazer o check-in e perguntar sobre o café da manhã.',dialogue:[['Receptionist','Welcome. How can I help you?'],['You','I have a reservation.'],['Receptionist','Sure. Here is your key.'],['You','What time is breakfast?']],items:[['I have a reservation.','Eu tenho uma reserva.'],['Can I check in?','Posso fazer o check-in?'],['What’s the Wi-Fi password?','Qual é a senha do Wi-Fi?'],['I need a towel, please.','Preciso de uma toalha, por favor.'],['What time is breakfast?','Que horas é o café da manhã?']]},
{id:9,mod:'Viagem',icon:'✈️',title:'Restaurante',desc:'Peça comida e resolva situações comuns.',context:'Você está em um restaurante durante uma viagem. Vai pedir uma mesa, escolher seu prato e depois pedir a conta.',dialogue:[['Waiter','Good evening.'],['You','A table for two, please.'],['Waiter','Here is the menu.'],['You','I’d like the chicken, please.']],items:[['A table for two, please.','Uma mesa para dois, por favor.'],['Can I see the menu?','Posso ver o cardápio?'],['I’d like the chicken, please.','Eu gostaria do frango, por favor.'],['Could I have the bill, please?','Pode trazer a conta, por favor?'],['This is delicious!','Isso está delicioso!']]},
{id:10,mod:'Cidade',icon:'🗺️',title:'Como pedir informações',desc:'Não se perca em uma cidade desconhecida.',context:'Você está em uma cidade que não conhece. Precisa encontrar uma estação e entender as instruções.',dialogue:[['You','Excuse me, where is the station?'],['Person','Go straight ahead.'],['You','Is it far from here?'],['Person','No, it’s nearby.']],items:[['Excuse me, where is the station?','Com licença, onde fica a estação?'],['How do I get there?','Como eu chego lá?'],['Is it far from here?','É longe daqui?'],['Go straight ahead.','Siga em frente.'],['Turn left at the corner.','Vire à esquerda na esquina.']]},
{id:11,mod:'Compras',icon:'🛍️',title:'Lojas e compras',desc:'Preços, tamanhos, pagamento e troca.',context:'Você está em uma loja. Encontrou uma roupa, mas precisa perguntar o preço, o tamanho e se pode pagar com cartão.',dialogue:[['Clerk','Can I help you?'],['You','Do you have a larger size?'],['Clerk','Yes. Here you are.'],['You','Can I pay by card?']],items:[['How much is this?','Quanto custa isto?'],['Do you have a larger size?','Você tem um tamanho maior?'],['Can I try it on?','Posso experimentar?'],['I’ll take it.','Eu vou levar.'],['Can I pay by card?','Posso pagar com cartão?']]},
{id:12,mod:'Social',icon:'☕',title:'Conversa casual',desc:'Pequenas conversas para ganhar confiança.',context:'Você está tomando um café com uma pessoa que acabou de conhecer. O objetivo é manter uma conversa leve.',dialogue:[['Alex','How was your weekend?'],['You','It was great.'],['Alex','What do you do for fun?'],['You','I like watching movies.']],items:[['How was your weekend?','Como foi seu fim de semana?'],['What do you do for fun?','O que você faz para se divertir?'],['I like watching movies.','Eu gosto de assistir filmes.'],['That sounds great!','Isso parece ótimo!'],['Let’s keep in touch.','Vamos manter contato.']]},
{id:13,mod:'Emergências',icon:'🆘',title:'Preciso de ajuda',desc:'Frases essenciais para situações inesperadas.',context:'Você está viajando e acontece uma situação em que precisa pedir ajuda rapidamente.',dialogue:[['You','I need help.'],['Person','What happened?'],['You','I don’t feel well.'],['Person','I’ll call for help.']],items:[['I need help.','Eu preciso de ajuda.'],['Call the police, please.','Chame a polícia, por favor.'],['I don’t feel well.','Não estou me sentindo bem.'],['Where is the nearest hospital?','Onde fica o hospital mais próximo?'],['I lost my wallet.','Perdi minha carteira.']]},
{id:14,mod:'Fluência',icon:'🗣️',title:'Destravando a conversa',desc:'Conecte frases e mantenha o diálogo.',context:'Você já sabe frases básicas. Agora precisa ganhar tempo, reagir e devolver perguntas para manter a conversa.',dialogue:[['Alex','What do you think?'],['You','Let me think for a second.'],['Alex','Sure.'],['You','Actually, I think it depends.']],items:[['Let me think for a second.','Deixe-me pensar por um segundo.'],['Actually, I think…','Na verdade, eu acho…'],['It depends.','Depende.'],['That makes sense.','Isso faz sentido.'],['What about you?','E você?']]}
];
const modules=[...new Map(lessons.map(l=>[l.mod,{name:l.mod,icon:l.icon}])).values()];
let state=JSON.parse(localStorage.getItem('englishLife16')||'null')||{done:[],xp:0,streak:0,settings:{voice:true,auto:false,rate:.86,voiceLang:'en-US'}};
function save(){localStorage.setItem('englishLife16',JSON.stringify(state))}
function speak(t){if(!state.settings.voice){toast('Áudio desativado nas configurações.');return}if(!('speechSynthesis'in window)){toast('Seu navegador não oferece síntese de voz.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=state.settings.voiceLang;u.rate=Number(state.settings.rate);speechSynthesis.speak(u)}
function listen(expected,cb){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Reconhecimento de voz não disponível neste navegador. Use Chrome/Edge e permita o microfone.');return}const r=new SR();r.lang=state.settings.voiceLang;r.interimResults=false;r.maxAlternatives=3;r.onstart=()=>toast('🎙️ Fale agora...');r.onerror=e=>toast('Microfone: '+(e.error==='not-allowed'?'permita o acesso ao microfone.':'tente novamente.'));r.onresult=e=>{let said=e.results[0][0].transcript.trim();let norm=x=>x.toLowerCase().replace(/[^a-z0-9áéíóúãõç' ]/gi,'').replace(/\s+/g,' ');let a=norm(said),b=norm(expected);let words=b.split(' '),hits=words.filter(w=>a.includes(w)).length;let score=Math.round(hits/words.length*100);cb(said,score)};r.start()}
function toast(msg){let d=document.createElement('div');d.textContent=msg;d.style='position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:12px;z-index:50;font-size:13px;max-width:90%;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function nav(active){return `<nav class="bottom"><button class="nav ${active==='home'?'active':''}" onclick="home()"><span>🏠</span>Início</button><button class="nav ${active==='learn'?'active':''}" onclick="learn()"><span>📚</span>Lições</button><button class="nav ${active==='practice'?'active':''}" onclick="practice()"><span>🎯</span>Praticar</button><button class="nav ${active==='profile'?'active':''}" onclick="profile()"><span>👤</span>Progresso</button></nav>`}
async function micStatus(){
 const el=document.getElementById('micPermissionStatus');
 if(!el)return;
 if(!window.isSecureContext){el.innerHTML='<div class="warning-box">⚠️ Este arquivo foi aberto fora de um ambiente seguro. O navegador pode bloquear o microfone. Para reconhecimento de voz, use o app em HTTPS ou como aplicativo instalado (PWA).</div>';return;}
 if(!navigator.mediaDevices?.getUserMedia){el.innerHTML='<div class="warning-box">⚠️ Este navegador não disponibiliza acesso ao microfone nesta página.</div>';return;}
 try{
  if(navigator.permissions?.query){const p=await navigator.permissions.query({name:'microphone'}); el.innerHTML='<div class="voice-status">🎙️ Status do microfone: <b>'+({granted:'autorizado',denied:'bloqueado',prompt:'aguardando permissão'}[p.state]||p.state)+'</b>.</div>'; p.onchange=()=>micStatus();}
  else el.innerHTML='<div class="voice-status">🎙️ O navegador permite solicitar a permissão quando você tocar no botão.</div>';
 }catch(e){el.innerHTML='<div class="voice-status">🎙️ Toque em “Solicitar permissão” para testar o microfone.</div>';}
}
async function requestMicFromSettings(){
 const ok=await requestMicPermission();
 const el=document.getElementById('micPermissionStatus');
 if(ok){if(el)el.innerHTML='<div class="success-box">✓ Microfone autorizado neste navegador para este site. Você já pode usar “Responder falando”.</div>';}
 else micStatus();
}
function microphoneHelp(){
 const secure=window.isSecureContext?'Ambiente seguro detectado.':'Este arquivo está em um ambiente que pode bloquear microfone.';
 const el=document.getElementById('micPermissionStatus');
 if(el)el.innerHTML='<div class="notice">'+secure+'<br><br><b>Se estiver bloqueado:</b> abra as configurações do site no Chrome → Permissões → Microfone → Permitir. Depois volte ao aplicativo e toque em “Verificar microfone”.</div>';
}
function settings(){document.getElementById('app').innerHTML=`<header class="lesson-head"><button class="back" onclick="home()">← Voltar</button><div class="lesson-title">⚙️ Configurações</div><div class="step">Controle áudio, voz, microfone e velocidade.</div></header><main class="section"><div class="card"><h3>🎙️ Microfone e reconhecimento de voz</h3><p class="pt">A permissão é solicitada pelo navegador por segurança. O aplicativo não pode liberar uma permissão que o navegador tenha bloqueado.</p><div id="micPermissionStatus" style="margin-top:12px"></div><div class="actions"><button class="btn primary" onclick="requestMicFromSettings()">🎙️ Solicitar permissão</button><button class="btn secondary" onclick="micStatus()">🔎 Verificar microfone</button><button class="btn secondary" onclick="microphoneHelp()">❓ Como liberar</button></div><div class="notice" style="margin-top:12px">Para reconhecimento de voz no Android, use o Chrome em uma página HTTPS ou instale o aplicativo como PWA. Um arquivo aberto diretamente como <b>file://</b> pode ter o microfone bloqueado pelo navegador.</div></div><div class="card"><h3>Áudio das frases</h3><div class="setting"><span>Ativar reprodução de áudio</span><button class="switch ${state.settings.voice?'on':''}" onclick="toggleSetting('voice')"><i></i></button></div><div class="setting"><span>Reproduzir automaticamente</span><button class="switch ${state.settings.auto?'on':''}" onclick="toggleSetting('auto')"><i></i></button></div><div class="setting"><span>Velocidade</span><select onchange="state.settings.rate=this.value;save()"><option value="0.65" ${state.settings.rate==.65?'selected':''}>Lenta</option><option value="0.86" ${state.settings.rate==.86?'selected':''}>Normal</option><option value="1" ${state.settings.rate==1?'selected':''}>Rápida</option></select></div><div class="setting"><span>Idioma da voz</span><select onchange="state.settings.voiceLang=this.value;save()"><option value="en-US" ${state.settings.voiceLang==='en-US'?'selected':''}>English — EUA</option><option value="en-GB" ${state.settings.voiceLang==='en-GB'?'selected':''}>English — Reino Unido</option></select></div></div><div class="card"><h3>Teste de áudio</h3><p class="pt">Clique para verificar se o aparelho consegue reproduzir a voz em inglês.</p><button class="btn primary" style="margin-top:14px" onclick="speak('Hello! Welcome to English Life. Let’s practice English together.')">🔊 Testar áudio</button></div></main>`;setTimeout(micStatus,0)}
function toggleSetting(k){state.settings[k]=!state.settings[k];save();settings()}
function home(){let d=lessons.filter(l=>state.done.includes(l.id)).length;let daily=lessons[d%lessons.length];document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><div class="logo">English Life <small>1.6</small></div><div class="top-actions"><div class="streak">🔥 ${state.streak} dias</div><button class="iconbtn" onclick="settings()">⚙️</button></div></div><div class="hello">Inglês para a vida real.</div><div class="sub">Entenda o contexto. Ouça. Responda. Fale.</div><div class="progress"><i style="width:${Math.round(d/lessons.length*100)}%"></i></div></header><main class="section"><div class="card hero"><div class="eyebrow">Próxima lição</div><div class="daily">${daily.icon} ${daily.title}</div><p>${daily.desc}</p><div class="actions"><button class="btn primary" onclick="lesson(${daily.id},'home')">Começar lição</button><button class="btn secondary" onclick="speak('${daily.items[0][0]}')">🔊 Ouvir</button></div></div><h2 style="margin:24px 0 12px">Aprenda por situação</h2><div class="grid">${modules.map(m=>{let ls=lessons.filter(x=>x.mod===m.name),done=ls.filter(x=>state.done.includes(x.id)).length;return `<button class="module" onclick="moduleView('${m.name}')"><div class="icon">${m.icon}</div><h3>${m.name}</h3><p>${done}/${ls.length} lições</p><div class="bar"><i style="width:${done/ls.length*100}%"></i></div></button>`}).join('')}</div></main>${nav('home')}`}
function moduleView(name){let ls=lessons.filter(l=>l.mod===name);document.getElementById('app').innerHTML=`<header class="lesson-head"><button class="back" onclick="home()">← Voltar</button><div class="lesson-title">${ls[0].icon} ${name}</div><div class="step">Situações reais para usar imediatamente.</div></header><main class="section">${ls.map(l=>`<button class="card" style="width:100%;text-align:left" onclick="lesson(${l.id},'module')"><span class="pill">${state.done.includes(l.id)?'✓ Concluída':'Disponível'}</span><h3 style="margin-top:10px">${l.title}</h3><p class="pt">${l.desc}</p><p class="small" style="margin-top:10px">Contexto + diálogo + perguntas + escuta + fala</p></button>`).join('')}</main>${nav('learn')}`}
function learn(){document.getElementById('app').innerHTML=`<header class="lesson-head"><div class="lesson-title">📚 Trilha de aprendizagem</div><div class="step">Você aprende inglês dentro de situações, não frases isoladas.</div></header><main class="section"><input class="search" placeholder="🔎 Buscar situação..." oninput="filterLessons(this.value)"><div id="lessonList"></div></main>${nav('learn')}`;filterLessons('')}
function filterLessons(q){let arr=lessons.filter(l=>(l.title+' '+l.mod+' '+l.desc).toLowerCase().includes(q.toLowerCase()));document.getElementById('lessonList').innerHTML=arr.map(l=>`<button class="card" style="width:100%;text-align:left" onclick="lesson(${l.id},'learn')"><b>${l.icon} ${l.title}</b><p class="pt">${l.mod} · ${l.desc}</p></button>`).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function normalize(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function similarity(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;if(a===b)return 100;const aw=a.split(' '),bw=b.split(' ');const set=new Set(aw);let hits=bw.filter(w=>set.has(w)).length;let overlap=hits/Math.max(aw.length,bw.length);let bonus=(a.includes(b)||b.includes(a))?0.25:0;let lev=1-editDistance(a,b)/Math.max(a.length,b.length);return Math.round(Math.min(1,Math.max(overlap,lev*.72)+bonus)*100)}
function editDistance(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
let lessonOrigin='learn';
function lesson(id,origin){lessonOrigin=origin||'learn';let l=lessons.find(x=>x.id===id),i=0,score=0,answered=false,recognition=null,advanceTimer=null;
function intro(){
 document.getElementById('app').innerHTML=`<header class="lesson-head"><button class="back" onclick="learn()">← Lições</button><div class="lesson-title">${l.icon} ${l.title}</div><div class="step">Entenda a situação antes de responder.</div></header><main class="section"><div class="card"><div class="eyebrow">Contexto da situação</div><p style="margin-top:8px;line-height:1.55">${l.context}</p><div class="dialogue">${l.dialogue.map((d,n)=>`<div class="bubble ${n%2?'b':'a'}"><b>${esc(d[0])}:</b> ${esc(d[1])} <button style="float:right;background:none" onclick='speak(${JSON.stringify(d[1])})'>🔊</button></div>`).join('')}</div></div><div class="card"><h3>🎯 O que você vai praticar</h3><p class="pt">Você verá a pergunta em português, escolherá a resposta, ouvirá o inglês e depois falará a frase. A lição só avança depois que a resposta for avaliada.</p><button class="btn primary" style="margin-top:15px;width:100%" onclick="startLesson()">Começar prática</button></div></main>`;
 window.startLesson=()=>render();
}
function render(){
 if(recognition){try{recognition.abort()}catch(e){} recognition=null}
 answered=false;let item=l.items[i];
 const choicesHtml=choices(item).map((x,n)=>`<button id="choice-${n}" class="choice" onclick="answerChoice(this,${x.correct})">${esc(x.text)}</button>`).join('');
 document.getElementById('app').innerHTML=`<header class="lesson-head"><button class="back" onclick="lessonBack()">← Contexto</button><div class="lesson-title">${l.icon} ${l.title}</div><div class="step">Pergunta ${i+1} de ${l.items.length}</div></header><main class="section"><div class="card"><div class="eyebrow">1 · Entenda a pergunta</div><h2 style="margin-top:8px">Como você diria:</h2><p style="font-size:20px;font-weight:800;margin-top:8px">“${esc(item[1])}”</p><div class="actions"><button class="btn secondary" onclick='speak(${JSON.stringify(item[0])})'>🔊 Ouvir resposta</button><button class="btn secondary" onclick="requestMicPermission()">🎙️ Permitir microfone</button><button id="micBtn" class="btn mic" onclick="startVoice()">🎙️ Responder falando</button></div><div id="voicefb" class="voice-status">Microfone pronto. Toque em “Responder falando” e diga a frase em inglês.</div><div class="text-answer"><input id="typedAnswer" autocomplete="off" placeholder="Ou digite sua resposta em inglês"><button class="btn secondary" onclick="checkTyped()">Verificar</button></div></div><div class="card"><div class="eyebrow">2 · Escolha a resposta</div>${choicesHtml}<div id="fb"></div><div id="nextArea" class="next-wrap"></div></div></main>`;
 if(state.settings.auto)speak(item[0]);
}
function choices(item){
 const pool=[
  {text:item[0],correct:true},
  {text:'I don’t understand the question.',correct:false},
  {text:'Could you help me with this?',correct:false},
  {text:'Where can I find the information?',correct:false}
 ];
 for(let n=pool.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[pool[n],pool[j]]=[pool[j],pool[n]]}
 return pool
}
function showSuccess(source,said,percent){if(answered)return;answered=true;score++;state.xp+=3;save();const fb=document.getElementById('fb');if(fb)fb.innerHTML=`<div class="success-box"><b>✓ Muito bem!</b><div style="margin-top:5px">Resposta aceita ${source==='voice'?`com ${percent}% de correspondência`:''}.</div>${said?`<div class="small" style="margin-top:5px">Você disse: “${esc(said)}”</div>`:''}</div>`;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);const next=document.getElementById('nextArea');if(next)next.innerHTML=`<button class="btn primary" style="width:100%" onclick="nextQuestion()">${i<l.items.length-1?'➡️ Próxima pergunta':'🏆 Concluir lição'}</button>`;advanceTimer=setTimeout(function(){if(answered)nextQuestion()},1200);}
function showWrong(msg){const fb=document.getElementById('fb');if(fb)fb.innerHTML=`<div class="warning-box"><b>Quase!</b><div style="margin-top:5px">${msg}</div></div>`}
function answerChoice(el,ok){
 if(answered)return;
 if(ok){
  el.classList.add('correct');
  showSuccess('choice');
 }else{
  el.classList.add('wrong');
  el.disabled=true;
  showWrong('Essa opção não é a correta. Tente outra alternativa — a resposta certa não será revelada.');
 }
}
function checkTyped(){if(answered)return;const input=document.getElementById('typedAnswer');const said=input?input.value.trim():'';if(!said){showWrong('Digite uma resposta antes de verificar.');return}const p=similarity(said,l.items[i][0]);if(p>=70){showSuccess('typed',said,p)}else{showWrong(`Você escreveu “${esc(said)}”. Correspondência aproximada: ${p}%. Ouça a frase e tente novamente.`);const next=document.getElementById('nextArea');if(next)next.innerHTML='';}}
async function requestMicPermission(){
 const box=document.getElementById('voicefb');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
  if(box)box.innerHTML='<div class=\"warning-box\">Seu navegador não oferece acesso direto ao microfone. Use Chrome ou Edge.</div>';
  return false;
 }
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  stream.getTracks().forEach(t=>t.stop());
  if(box)box.innerHTML='<div class=\"success-box\">✓ Microfone autorizado. Agora toque em “Responder falando”.</div>';
  return true;
 }catch(err){
  if(box)box.innerHTML='<div class=\"warning-box\">🎙️ O microfone foi bloqueado ou a permissão não foi concedida. Abra as permissões do site no navegador e permita o microfone.</div>';
  return false;
 }
}
async function startVoice(){
 if(answered)return;
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 const box=document.getElementById('voicefb'),btn=document.getElementById('micBtn');
 if(!SR){if(box)box.innerHTML='<div class=\"warning-box\">🎙️ Reconhecimento de voz não disponível neste navegador. Use Chrome/Edge no Android ou digite a resposta abaixo.</div>';return;}
 const permitted=await requestMicPermission();
 if(!permitted)return;
 try{if(recognition)recognition.abort()}catch(e){}
 recognition=new SR();
 recognition.lang=state.settings.voiceLang||'en-US';
 recognition.interimResults=false;
 recognition.continuous=false;
 recognition.maxAlternatives=5;
 if(btn){btn.disabled=true;btn.textContent='🎙️ Ouvindo...';}
 if(box)box.innerHTML='<div class=\"voice-status\">🎙️ Estou ouvindo. Fale a frase inteira agora...</div>';
 recognition.onresult=function(e){
  const said=Array.from(e.results).map(r=>r[0]?.transcript||'').join(' ').trim();
  const p=similarity(said,l.items[i][0]);
  if(p>=65){showSuccess('voice',said,p);if(box)box.innerHTML='<div class=\"success-box\">✓ Reconheci: “'+esc(said)+'”</div>';}
  else{if(box)box.innerHTML='<div class=\"warning-box\">Você disse: “'+esc(said)+'” — '+p+'% de correspondência. Tente novamente.</div>';showWrong('Ainda não corresponde o suficiente. Ouça novamente e repita.');}
 };
 recognition.onerror=function(e){
  const msg=e.error==='not-allowed'||e.error==='service-not-allowed'?'Permissão de microfone negada. Abra as permissões do navegador e permita o microfone.':e.error==='no-speech'?'Nenhuma fala foi detectada. Toque novamente e fale a frase.':'Não consegui reconhecer sua voz. Tente novamente.';
  if(box)box.innerHTML='<div class=\"warning-box\">'+msg+'</div>';
 };
 recognition.onend=function(){recognition=null;if(btn){btn.disabled=false;btn.textContent='🎙️ Responder falando';}};
 try{recognition.start()}catch(e){if(box)box.innerHTML='<div class=\"warning-box\">Não foi possível iniciar o reconhecimento. Tente novamente.</div>';if(btn){btn.disabled=false;btn.textContent='🎙️ Responder falando';}}
}
function nextQuestion(){if(advanceTimer){clearTimeout(advanceTimer);advanceTimer=null}if(i<l.items.length-1){i++;render()}else finish()}
function finish(){if(!state.done.includes(l.id)){state.done.push(l.id);state.xp+=20;state.streak=Math.max(1,state.streak);save()}document.getElementById('app').innerHTML=`<header class="lesson-head"><div class="lesson-title">🎉 Lição concluída!</div><div class="step">${l.title}</div></header><main class="section"><div class="card hero" style="text-align:center"><div style="font-size:52px">🏆</div><h2>Excelente!</h2><p class="pt">Você concluiu ${l.items.length} situações de resposta.</p><div class="pill" style="margin-top:14px">+20 XP</div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="nextLesson()">➡️ Próxima lição</button><button class="btn secondary" onclick="learn()">📚 Ver lições</button></div></div></main>${nav('learn')}`}
function nextLesson(){let idx=lessons.findIndex(x=>x.id===l.id);if(idx>=0&&idx<lessons.length-1)lesson(lessons[idx+1].id);else learn()}
window.lessonBack=function(){
 if(recognition){try{recognition.abort()}catch(e){}}
 if(advanceTimer){clearTimeout(advanceTimer);advanceTimer=null}
 if(lessonOrigin==='home') home(); else if(lessonOrigin==='module') moduleView(l.mod); else learn();
};
window.intro=intro; window.startVoice=startVoice; window.checkTyped=checkTyped; window.answerChoice=answerChoice; window.nextQuestion=nextQuestion; window.nextLesson=nextLesson;
intro()}
function practice(){let pool=lessons.flatMap(l=>l.items.map(x=>({en:x[0],pt:x[1]}))),q=pool[Math.floor(Math.random()*pool.length)],opts=[q,...pool.filter(x=>x.en!==q.en).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);let practiceDone=false;function show(){document.getElementById('app').innerHTML=`<header class="lesson-head"><div class="lesson-title">🎯 Prática</div><div class="step">Responda, ouça, fale e avance.</div></header><main class="section"><div class="card"><div class="eyebrow">Pergunta</div><h2 style="margin-top:8px">“${esc(q.pt)}”</h2>${opts.map((o,n)=>`<button id="po-${n}" class="choice" onclick="pChoice(this,${o.en===q.en})">${esc(o.en)}</button>`).join('')}<div id="pf"></div><div class="actions"><button class="btn secondary" onclick='speak(${JSON.stringify(q.en)})'>🔊 Ouvir</button><button class="btn mic" id="pmic" onclick="pVoice()">🎙️ Falar</button></div><div class="text-answer"><input id="pTyped" placeholder="Digite a resposta"><button class="btn secondary" onclick="pTypedCheck()">Verificar</button></div><div id="pnext" class="next-wrap"></div></div></main>${nav('practice')}`}
window.pChoice=(el,ok)=>{if(practiceDone)return;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);if(ok){el.classList.add('correct');practiceDone=true;state.xp+=5;save();document.getElementById('pf').innerHTML='<div class="success-box"><b>✓ Correto!</b></div>';document.getElementById('pnext').innerHTML='<button class="btn primary" style="width:100%" onclick="practice()">➡️ Nova pergunta</button>'}else{el.classList.add('wrong');document.getElementById('pf').innerHTML='<div class="warning-box">Veja a resposta correta destacada e avance quando estiver pronto.</div>';document.querySelectorAll('.choice').forEach(x=>{if(normalize(x.textContent)===normalize(q.en))x.classList.add('correct')});document.getElementById('pnext').innerHTML='<button class="btn primary" style="width:100%" onclick="practice()">➡️ Nova pergunta</button>'}}
window.pTypedCheck=()=>{if(practiceDone)return;let v=document.getElementById('pTyped').value,p=similarity(v,q.en);if(p>=70){practiceDone=true;state.xp+=5;save();document.getElementById('pf').innerHTML=`<div class="success-box">✓ Correto! (${p}%)</div>`;document.getElementById('pnext').innerHTML='<button class="btn primary" style="width:100%" onclick="practice()">➡️ Nova pergunta</button>'}else document.getElementById('pf').innerHTML=`<div class="warning-box">Correspondência: ${p}%. Tente novamente.</div>`}
window.pVoice=()=>{if(practiceDone)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('pf').innerHTML='<div class="warning-box">Reconhecimento de voz indisponível. Use o Chrome/Edge ou digite a resposta.</div>';return}const r=new SR();r.lang=state.settings.voiceLang||'en-US';r.interimResults=false;r.continuous=false;document.getElementById('pmic').disabled=true;document.getElementById('pmic').textContent='🎙️ Ouvindo...';r.onresult=e=>{let s=e.results[0][0].transcript,p=similarity(s,q.en);if(p>=65){practiceDone=true;state.xp+=5;save();document.getElementById('pf').innerHTML=`<div class="success-box">✓ Você disse: “${esc(s)}” — ${p}%</div>`;document.getElementById('pnext').innerHTML='<button class="btn primary" style="width:100%" onclick="practice()">➡️ Nova pergunta</button>'}else document.getElementById('pf').innerHTML=`<div class="warning-box">Você disse: “${esc(s)}” — ${p}%. Tente novamente.</div>`};r.onerror=e=>document.getElementById('pf').innerHTML='<div class="warning-box">Não consegui ouvir. Verifique a permissão do microfone e tente novamente.</div>';r.onend=()=>{document.getElementById('pmic').disabled=false;document.getElementById('pmic').textContent='🎙️ Falar'};r.start()};show()}
function profile(){let pct=Math.round(state.done.length/lessons.length*100);document.getElementById('app').innerHTML=`<header class="lesson-head"><div class="lesson-title">👤 Seu progresso</div><div class="step">Cada resposta praticada aproxima você da conversação.</div></header><main class="section"><div class="stats"><div class="stat"><b>${state.xp}</b><span class="small">XP</span></div><div class="stat"><b>${state.done.length}</b><span class="small">Lições</span></div><div class="stat"><b>${state.streak}</b><span class="small">Dias</span></div></div><div class="card" style="margin-top:14px"><h3>Trilha inicial</h3><p class="pt">${pct}% concluída.</p><div class="bar"><i style="width:${pct}%"></i></div></div><div class="card"><h3>Configurações de áudio</h3><p class="pt">Voz: ${state.settings.voice?'ativada':'desativada'} · ${state.settings.voiceLang} · ${state.settings.rate}x</p><button class="btn secondary" style="margin-top:12px" onclick="settings()">⚙️ Configurar</button></div><button class="btn ghost" style="width:100%" onclick="resetProgress()">Reiniciar progresso</button></main>${nav('profile')}`}
function resetProgress(){if(confirm('Reiniciar todo o progresso?')){state={done:[],xp:0,streak:0,settings:{voice:true,auto:false,rate:.86,voiceLang:'en-US'}};save();home()}}
home();
if ('serviceWorker' in navigator) { window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{})); }
</script></body></html>
